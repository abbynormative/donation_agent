name: Build & Deploy to MCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: donation-agent
          push: true
          tags: ${{ secrets.REGISTRY }}/donation-agent:${{ github.sha }}

      - name: Deploy to MCP (placeholder)
        env:
          MCP_CLI_TOKEN: ${{ secrets.MCP_CLI_TOKEN }}
          MCP_HOST: ${{ secrets.MCP_HOST }}
          IMAGE: ${{ secrets.REGISTRY }}/donation-agent:${{ github.sha }}
        run: |
          echo "Replace this with your MCP CLI deploy commands."
          echo "Example:"
          echo "mcpctl login --host $MCP_HOST --token $MCP_CLI_TOKEN"
          echo "mcpctl deploy --image $IMAGE --name donations-agent --env DATABASE_URL=${{ secrets.DATABASE_URL }}"
